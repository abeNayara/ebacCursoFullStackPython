<!--Agora que vimos todo o corpo documental do HTML, chegou a hora de aprender um pouco sobre as tags de texto, como, paragráfos, títulos, elementos semânticos, como inserir um link na página e muito mais. :) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Documento HTML</title>
</head>
<!-- Para começarmos, devo lembrar que as tags apresentadas agora são inseridas na tag "body", que foi mencionada em um commit anterior e está escrita no README.md-->
<body>
<!--A primeira tag que será apresentada é a de títulos, elas são representadas pela letra "h" seguida de um número(vão de 1 a 6), o número representará o nível hierárquico(importância) do título dentro do conteúdo de uma página-->
<h1>Título h1</h1>
    <h2>Título h2</h2>
        <h3>Título h3</h3>
            <h4>Título h4</h4>
                <h5>Título h5</h5>
                    <h6>Título h6</h6>
<!--Aqui temos todos os títulos que podemos inserir no HTML-->

<hr><!--A tag "hr" serve como uma quebra de linha temática, fazendo uma linha na horizontal, assim separando o conteúdo-->

<!-- Para se inserir um paragráfo deve-se utilizar a tag "p"-->
<p>
    Olá Mundo
</p>

<!--A tag "a" é usada como "âncora" para se colocar atributos como por exemplo o "href" que é utilizado para links. Quando um usuário clica no texto ou no elemento contido na tag, o navegador o levará ao endereço especificado no "href".-->
<a href="https://jpimg.com.br/uploads/2024/12/7-racas-de-gato-com-filhotes-muito-fofos.jpg" title="Gatinho cinza, clique!">Gatinho cinza</a>
</body>
</html>
