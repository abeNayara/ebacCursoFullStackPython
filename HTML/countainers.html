    Hoje veremos containers!-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers</title>
</head>
<body>
<!--Os containers servem como "caixas de agurpamento". São usados para organizar e agrupar elementos HTML, assim sendo essencial para aplicar o CSS de forma eficiente e controlada, o que permite aumentar o grau de complexidade(estetíca e de manupilação) da página.-->

<!--Tendo isso em mente, será apresentado agora alguns containers semânticos, eles se diferem da "div" por organizar melhor a paginá e suas funcionalidades-->

<!--Tag "header", este container serve como um "cabeçalho", é na onde se apresenta o conteúdo inicial da página, seus elementos principais incluem: títulos, logotipos, slogans e o elemento "nav" para navegar na página.-->

<!--"nav" é um container de navegação, podemos utilizar ele para pesquisar itens em uma página. Pode ser usado em outros containers como "section", normalmente utiliza "ul" e "li" para criar listas para navegação mais simplificada na página.-->

<body>
    <header>
        <h1>Meu primeiro container</h1>
        <p>Na tag "header" foi escríto meu primeiro container!!!</p>
        <nav>
            <ul>
                <li><a href="#artigos">Artigos</a></li>
                <li><a href="#sobre-nos">Sobre Nós</a></li>
                <li><a href="#contatos">Contatos</a></li>
                <li><a href="#nossa-hitoria">Nossa História</a></li>
            </ul>
        </nav>
    </header>
</body>

<!--Além de ficar dentro da tag "body" o "header" pode ser incluido dentro de uma "article" ou de uma "section" para ser um cabeçalho exclusivo daquele artigo ou seção.-->

<!--"main" tag que contém o elemento principal da página, aqui se engloba as principais tags e elementos que realizam o comportamento do documento como um todo.-->

<main>

<!--"section" é um container que divide o conteúdo em seções, por exemplo, pode se ter uma section para  "nav", outra para "utilizar", outra oara "outros-containers", etc.-->

<section>

</section>

<article>
    <header>
        <h2>A arte</h2>
        <p>Tema: Arte</p>
    </header>
    <p>A arte engloba arquitetura, cinema, dança, desenho, escultura, fotografia, literatura, música, pintura, poesia...</p>
</article>

</main>




</body>
</html>
